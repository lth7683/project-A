<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Science Shorts Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">Science Shorts</p>
          <h1 id="title">Untitled</h1>
        </div>
        <div class="stats">
          <span id="language">-</span>
          <span id="duration">-</span>
          <span id="status">-</span>
        </div>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>Video</h2>
          <div id="video-wrap" class="video-wrap"></div>
        </article>
        <article class="panel">
          <h2>Outputs</h2>
          <div id="outputs" class="links"></div>
          <h2>Audio</h2>
          <div id="audio-wrap" class="audio-wrap"></div>
        </article>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>Script</h2>
          <pre id="script"></pre>
        </article>
        <article class="panel">
          <h2>Sources</h2>
          <pre id="sources"></pre>
        </article>
      </section>

      <section>
        <h2>Scenes</h2>
        <div id="scenes" class="scenes"></div>
      </section>
    </main>
    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
