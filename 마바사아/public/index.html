<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Transcript Batch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <div class="input-pane">
          <div class="title-row">
            <div>
              <p class="eyebrow">youtube-transcript</p>
              <h1>유튜브 스크립트 일괄 추출</h1>
            </div>
            <span class="counter" id="linkCounter">0개</span>
          </div>

          <form id="transcriptForm">
            <label for="links">유튜브 링크</label>
            <textarea
              id="links"
              name="links"
              spellcheck="false"
              placeholder="https://www.youtube.com/watch?v=...
https://youtu.be/...
링크를 줄바꿈으로 여러 개 입력"
            ></textarea>

            <div class="controls">
              <div class="field">
                <label for="lang">언어 코드</label>
                <input id="lang" name="lang" placeholder="ko, en 등" autocomplete="off" />
              </div>
              <label class="check">
                <input id="timestamps" name="timestamps" type="checkbox" checked />
                <span>시간 포함</span>
              </label>
            </div>

            <div class="actions">
              <button class="primary" type="submit">추출하기</button>
              <button class="ghost" id="clearButton" type="button">초기화</button>
            </div>
          </form>
        </div>

        <div class="results-pane">
          <div class="results-head">
            <div>
              <p class="eyebrow">results</p>
              <h2>결과</h2>
            </div>
            <button class="ghost compact" id="downloadAll" type="button" disabled>전체 다운로드</button>
          </div>

          <div class="status idle" id="status">링크를 입력하고 추출을 시작하세요.</div>
          <div class="results" id="results"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
