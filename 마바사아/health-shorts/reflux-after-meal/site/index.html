<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>식후 바로 눕는 습관과 역류성 식도염 예방</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f1f4ef;
        color: #17211d;
        font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      }
      main {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
        gap: 28px;
        align-items: start;
      }
      video {
        width: 100%;
        aspect-ratio: 9 / 16;
        background: #101815;
        box-shadow: 0 18px 45px rgba(20, 32, 27, 0.18);
      }
      h1 { margin: 0 0 14px; font-size: 30px; line-height: 1.15; }
      p { color: #56635d; line-height: 1.65; }
      a {
        display: block;
        margin: 10px 0;
        color: #1f6f5b;
        font-weight: 800;
      }
      @media (max-width: 760px) {
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <video controls playsinline src="../renders/final.mp4"></video>
      <section>
        <h1>식후 바로 눕는 습관과 역류성 식도염 예방</h1>
        <p>중복 주제 검사를 통과한 건강상식 쇼츠입니다. ElevenLabs 음성과 중앙 자막, 세로형 실사 장면으로 렌더링했습니다.</p>
        <a href="../renders/final.mp4">MP4 열기</a>
        <a href="../script.md">대본 보기</a>
        <a href="../sources.md">근거 자료 보기</a>
      </section>
    </main>
  </body>
</html>
